name: Release & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release + deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      - run: pnpm build
      - name: Package dist.zip
        run: |
          cd apps/web/dist && zip -r ../../../dist.zip . && cd ../../..
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Publish preview URL
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dist.zip attached to the GitHub Release." >> "$GITHUB_STEP_SUMMARY"
