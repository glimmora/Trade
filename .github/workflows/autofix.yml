name: Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Lint/format autofix
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Loop guard — at most one autofix per SHA
        id: guard
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          COUNT=$(gh api "search/issues?q=repo:${{ github.repository }}+autofix+${SHA}" \
            --jq '.total_count' 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.count == '0'
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.guard.outputs.count == '0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.count == '0'
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        if: steps.guard.outputs.count == '0'
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        if: steps.guard.outputs.count == '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install
        if: steps.guard.outputs.count == '0'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            pnpm install
          fi
      - name: Fix lint/format
        if: steps.guard.outputs.count == '0'
        run: |
          pnpm exec eslint --fix "apps/**/*.{ts,tsx}" "packages/*/src/**/*.ts" "workers/*/src/**/*.ts" || true
          pnpm exec prettier --write "**/*.{ts,tsx,js,jsx,json,css,md,yml,yaml}" || true
      - name: Commit fix back to main
        if: steps.guard.outputs.count == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to fix."
            exit 0
          fi
          git commit -m "fix: autofix lint/format for ${{ github.event.workflow_run.head_sha }} [skip ci]"
          git push origin main
      - name: Open issue for failing tests
        if: steps.guard.outputs.count == '0'
        run: |
          gh issue create \
            --title "CI failure needs agent: ${{ github.event.workflow_run.head_sha }}" \
            --label "needs-agent" \
            --body "CI run failed: ${{ github.event.workflow_run.html_url }}
            Autofix for lint/format was attempted (if applicable).
            A subagent should read the logs, patch, and push a fix."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
