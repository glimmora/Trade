name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      indicators: ${{ steps.filter.outputs.indicators }}
      drawings: ${{ steps.filter.outputs.drawings }}
      providers: ${{ steps.filter.outputs.providers }}
      proxy: ${{ steps.filter.outputs.proxy }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig.base.json'
            core:
              - 'packages/core/**'
            indicators:
              - 'packages/indicators/**'
            drawings:
              - 'packages/drawings/**'
            providers:
              - 'packages/providers/**'
            proxy:
              - 'workers/proxy/**'
            e2e:
              - 'e2e/**'
              - 'apps/web/**'

  setup:
    name: Install (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      # NOTE: pnpm-lock.yaml is generated in CI by the
      # "Bootstrap pnpm lockfile" workflow; until it exists, installs run
      # without --frozen-lockfile and warn in the run summary.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Upload workspace for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace
          path: |
            .
            !.git/**
            !**/node_modules/**
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      - run: pnpm lint
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md,yml,yaml}"
      - run: pnpm typecheck

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: >
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.indicators == 'true' ||
      needs.changes.outputs.drawings == 'true' ||
      needs.changes.outputs.providers == 'true' ||
      needs.changes.outputs.proxy == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      # NOTE: no --coverage flag here -- turbo passes it to every package's
      # vitest, but @vitest/coverage-v8 is only installed in indicators and
      # core/web/proxy have no test files at all. Coverage is measured by
      # the advisory gate below, scoped to indicators + providers.
      # e2e runs in its own job against the built dist; turbo would run
      # its Playwright suite here too, and its preview server fails
      # without a build. Unit tests are the vitest suites only.
      - run: pnpm exec turbo run test --filter=!@trade/e2e
      - name: Coverage gate (>= 85% on indicators & providers)
        run: |
          pnpm exec vitest run --coverage --coverage.thresholds.lines=85 \
            packages/indicators packages/providers || true
          echo "Coverage gate is advisory in M1; hard gate lands with M4/M2 logic."

  build:
    name: Build + bundle budget
    runs-on: ubuntu-latest
    needs: [changes, setup]
    # e2e needs the dist artifact, so the build must also run when only
    # e2e files changed (otherwise e2e is skipped with its dependency).
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      - run: pnpm build
      - name: Bundle-size budget (initial JS <= 250 KB gz)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { gzipSync } = require('zlib');
            const dir = 'apps/web/dist/assets';
            // The budget is INITIAL JS only (spec: <= 250 KB gz). The
            // `charts` manual chunk is lazy-loaded via React.lazy, so it
            // is excluded from the initial sum and reported separately.
            let total = 0;
            let lazy = 0;
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith('.js')) continue;
              const gz = gzipSync(fs.readFileSync(path.join(dir, f))).length;
              if (f.startsWith('charts-')) {
                console.log(f, (gz / 1024).toFixed(1) + ' KB gz (lazy chunk, excluded)');
                lazy += gz;
                continue;
              }
              console.log(f, (gz / 1024).toFixed(1) + ' KB gz');
              total += gz;
            }
            console.log('Initial JS gz: ' + (total / 1024).toFixed(1) + ' KB');
            console.log('Lazy JS gz (excluded): ' + (lazy / 1024).toFixed(1) + ' KB');
            if (total > 250 * 1024) { console.error('Initial-JS bundle budget exceeded'); process.exit(1); }
          "
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # pnpm store cache (NOT setup-node's `cache: pnpm`: that step fails
      # when pnpm-lock.yaml is absent because its lockfile glob matches
      # nothing). hashFiles() on a missing lockfile yields an empty hash,
      # which is a plain cache miss -- never a failure.
      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile."
            echo "## Lockfile warning" >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm-lock.yaml was missing; dependencies were installed without --frozen-lockfile. Run the 'Bootstrap pnpm lockfile' workflow to commit a lockfile." >> "$GITHUB_STEP_SUMMARY"
            pnpm install
          fi
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @trade/e2e exec playwright install --with-deps chromium webkit
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Run Playwright shard ${{ matrix.shard }}/3
        run: pnpm --filter @trade/e2e test -- --shard=${{ matrix.shard }}/3
      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  live-smoke:
    name: Live-data smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Ping one public ticker endpoint
        run: |
          curl -fsS --max-time 15 "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT" \
            || echo "Live smoke failed (non-blocking)"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Serve preview
        run: pnpm dlx serve -l 4173 apps/web/dist &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:4173/ >/dev/null
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:4173/
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [lint, unit, build, e2e, lighthouse]
    if: always()
    steps:
      - name: Report timings
        run: |
          echo "## CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- lint: ${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- unit: ${{ needs.unit.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- e2e: ${{ needs.e2e.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- lighthouse: ${{ needs.lighthouse.result }}" >> "$GITHUB_STEP_SUMMARY"
