name: Bootstrap pnpm lockfile

# Generates and commits pnpm-lock.yaml in CI when it is missing.
# The lockfile cannot be generated locally (local installs are not run
# for this repo); CI is the only place `pnpm install` runs. Once the
# lockfile exists this workflow exits immediately, so it never loops.
# Trigger it manually the first time, or let it run when a package
# manifest changes while no lockfile is present.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "workers/**/package.json"
      - "e2e/package.json"

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate pnpm-lock.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Exit early if the lockfile already exists
        id: check
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml is missing — generating it in CI."
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.check.outputs.exists == 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 20
      - name: Generate lockfile (plain install, no frozen flag)
        if: steps.check.outputs.exists == 'false'
        run: pnpm install
      - name: Commit lockfile back to main (loop guard — one commit per run)
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile was generated."
            exit 0
          fi
          git commit -m "chore: add pnpm-lock.yaml generated in CI [skip ci]"
          git push origin main
          echo "## Lockfile bootstrapped" >> "$GITHUB_STEP_SUMMARY"
          echo "pnpm-lock.yaml was generated in CI and committed. Subsequent CI runs use --frozen-lockfile." >> "$GITHUB_STEP_SUMMARY"
