name: Auto-merge dependency patches

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge patch updates when CI is green
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch PR metadata
        id: meta
        run: |
          UPDATE_TYPE=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json labels --jq '.labels[].name' | grep -E 'patch|minor' | head -1 || true)
          echo "update_type=$UPDATE_TYPE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update_type == 'patch'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
